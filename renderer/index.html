<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>Canvas Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#EE9A6E"/>
            <stop offset=".55" stop-color="#D0643F"/>
            <stop offset="1" stop-color="#9E3A26"/>
          </linearGradient>
          <radialGradient id="logo-glow" cx=".5" cy=".58" r=".42">
            <stop offset="0" stop-color="#FFE7C9" stop-opacity=".55"/>
            <stop offset="1" stop-color="#FFE7C9" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="logo-shine" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
            <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="15" fill="url(#logo-bg)"/>
        <rect width="64" height="64" rx="15" fill="url(#logo-shine)"/>
        <path d="M19 50V30a13 13 0 0 1 26 0v20Z" fill="url(#logo-glow)"/>
        <path d="M19 50V30a13 13 0 0 1 26 0v20" fill="none" stroke="#FFF6EE" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 50h36" stroke="#FFF6EE" stroke-width="4.2" stroke-linecap="round" opacity=".55"/>
        <path d="M32 27.5c.9 4.3 2.7 6.1 7 7-4.3.9-6.1 2.7-7 7-.9-4.3-2.7-6.1-7-7 4.3-.9 6.1-2.7 7-7Z" fill="#FFF6EE"/>
      </svg>
      <span>Canvas Portal</span>
    </div>

    <section id="account" class="account"></section>

    <section class="upcoming">
      <div class="side-head">
        <span>Coming up</span>
        <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5V6h-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="upcoming" class="up-list"></div>
    </section>

    <button id="new-chat" class="new-chat">
      <svg viewBox="0 0 20 20" width="15" height="15"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      New chat
    </button>
  </aside>

  <main class="main">
    <div id="scroller" class="scroller">
      <div id="thread" class="thread"></div>
    </div>

    <form id="composer" class="composer">
      <div id="chips" class="chips"></div>
      <div class="box">
        <button type="button" id="attach" class="icon-btn attach" title="Attach files" aria-label="Attach files">
          <svg viewBox="0 0 20 20" width="18" height="18"><path d="M14.5 9.5 9.3 14.7a3.2 3.2 0 0 1-4.5-4.5l6-6a2.1 2.1 0 0 1 3 3l-5.8 5.8a1 1 0 0 1-1.5-1.5L11.8 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Ask about your assignments…"></textarea>
        <div class="model-pick">
          <button type="button" id="model-btn" class="model-btn" aria-haspopup="menu" title="Choose the model">
            <span id="model-name">Sonnet</span>
            <svg viewBox="0 0 20 20" width="12" height="12"><path d="M6 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="model-menu" class="model-menu" role="menu"></div>
        </div>
        <button type="submit" id="send" class="send" aria-label="Send">
          <svg class="i-send" viewBox="0 0 20 20" width="17" height="17"><path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="i-stop" viewBox="0 0 20 20" width="13" height="13"><rect x="4" y="4" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="hint">Claude can read your courses, assignments and files. Nothing gets submitted unless you click <b>Submit</b> on a card.</div>
    </form>

    <div id="drop" class="drop"><div>Drop files to attach them</div></div>
  </main>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
